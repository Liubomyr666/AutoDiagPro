name: Build AutoDiag Pro iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "AutoDiagPro.Mobile/**"
      - ".github/workflows/build-ios-ipa.yml"
      - "global.json"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.425"
      - name: Verify .NET
        run: dotnet --version
      - name: Install MAUI iOS workload
        run: |
          dotnet workload install maui-ios
          dotnet workload list
      - name: Read app version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' AutoDiagPro.Mobile/AutoDiagPro.Mobile.csproj | head -n 1)"
          APP_BUILD="$(sed -n 's:.*<ApplicationVersion>\(.*\)</ApplicationVersion>.*:\1:p' AutoDiagPro.Mobile/AutoDiagPro.Mobile.csproj | head -n 1)"
          test -n "$APP_VERSION"
          test -n "$APP_BUILD"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$APP_BUILD" >> "$GITHUB_ENV"
      - name: Restore
        working-directory: AutoDiagPro.Mobile
        run: dotnet restore AutoDiagPro.Mobile.csproj
      - name: Build unsigned iPhone app
        working-directory: AutoDiagPro.Mobile
        run: |
          dotnet build AutoDiagPro.Mobile.csproj \
            -f net8.0-ios \
            -c Release \
            -r ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false
      - name: Create unsigned IPA for AltStore
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find AutoDiagPro.Mobile/bin/Release/net8.0-ios/ios-arm64 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          IPA_NAME="AutoDiagPro_iOS_v${APP_VERSION}_build${APP_BUILD}_AltStore.ipa"
          cd ipa
          /usr/bin/zip -qry "../$IPA_NAME" Payload
          cd ..
          ls -lh "$IPA_NAME"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AutoDiagPro-iOS-v${{ env.APP_VERSION }}-build${{ env.APP_BUILD }}-AltStore
          path: AutoDiagPro_iOS_v${{ env.APP_VERSION }}_build${{ env.APP_BUILD }}_AltStore.ipa
          if-no-files-found: error
          retention-days: 30
