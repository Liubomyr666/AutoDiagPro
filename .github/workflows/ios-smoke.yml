name: iOS Runtime Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "AutoDiagPro.Mobile/**"
      - ".github/workflows/ios-smoke.yml"
      - "global.json"

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.425"

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Build iOS simulator app
        working-directory: AutoDiagPro.Mobile
        run: |
          dotnet build AutoDiagPro.Mobile.csproj \
            -f net8.0-ios \
            -c Debug \
            -r iossimulator-arm64 \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false \
            -p:DefineConstants=SMOKE_CLIENT_UI

      - name: Boot fresh simulator and launch app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find AutoDiagPro.Mobile/bin/Debug/net8.0-ios/iossimulator-arm64 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"

          # Fresh iOS runtimes validate bundle resources. Ad-hoc sign the simulator bundle
          # so SplashBoard/AppIcon resources are accepted during the runtime smoke test.
          /usr/bin/codesign --force --deep --sign - "$APP_PATH"

          DEVICE="$(python3 - <<'PY'
          import json, subprocess
          types=json.loads(subprocess.check_output(["xcrun","simctl","list","devicetypes","-j"]))["devicetypes"]
          runtimes=json.loads(subprocess.check_output(["xcrun","simctl","list","runtimes","-j"]))["runtimes"]
          dtype=next(x["identifier"] for x in types if x["name"]=="iPhone 16 Pro")
          runtime=[x["identifier"] for x in runtimes if x.get("isAvailable") and "iOS" in x.get("name","")][-1]
          print(subprocess.check_output(["xcrun","simctl","create","AutoDiagProSmoke",dtype,runtime], text=True).strip())
          PY
          )"

          test -n "$DEVICE"
          trap 'xcrun simctl shutdown "$DEVICE" >/dev/null 2>&1 || true; xcrun simctl delete "$DEVICE" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$DEVICE"

          python3 - "$DEVICE" "$APP_PATH" <<'PY'
          import subprocess, sys, time
          device, app_path = sys.argv[1], sys.argv[2]
          bundle = "com.autodiagpro.app"

          booted = False
          for attempt in range(2):
              try:
                  subprocess.run(["xcrun","simctl","bootstatus",device,"-b"], timeout=360, check=True)
                  booted = True
                  break
              except (subprocess.TimeoutExpired, subprocess.CalledProcessError):
                  if attempt == 0:
                      subprocess.run(["xcrun","simctl","shutdown",device], check=False)
                      time.sleep(6)
                      subprocess.run(["xcrun","simctl","boot",device], check=False)
                  else:
                      raise
          if not booted:
              raise SystemExit("Simulator did not reach booted state.")

          subprocess.run(["xcrun","simctl","install",device,app_path], timeout=240, check=True)

          launch_text = ""
          proc = subprocess.Popen(
              ["xcrun","simctl","launch","--terminate-running-process",device,bundle],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          launch_timed_out = False
          try:
              out, _ = proc.communicate(timeout=45)
              launch_text += out or ""
          except subprocess.TimeoutExpired:
              launch_timed_out = True
              proc.kill()
              out, _ = proc.communicate(timeout=10)
              launch_text += out or ""
              launch_text += "\nsimctl launch timed out; this is a failed startup.\n"

          if launch_timed_out or proc.returncode != 0 or bundle not in launch_text:
              with open("launch.txt","w") as out:
                  out.write(launch_text)
              raise SystemExit(
                  "iOS app failed to launch: timeout, non-zero simctl exit or no bundle confirmation. "
                  + launch_text)

          with open("launch.txt","w") as out:
              out.write(launch_text)

          time.sleep(8)
          subprocess.run(["xcrun","simctl","io",device,"screenshot","screenshot.png"], check=True)
          with open("app-log.txt","w") as log:
              subprocess.run([
                  "xcrun","simctl","spawn",device,"log","show","--style","compact","--last","4m",
                  "--predicate",'process CONTAINS[c] "AutoDiag" OR eventMessage CONTAINS[c] "AutoDiag"'
              ], stdout=log, stderr=subprocess.STDOUT, text=True, check=False)

          logs = open("app-log.txt", errors="ignore").read()
          fatal_markers = ["SIGABRT", "SIGSEGV", "Unhandled exception", "Terminated due to signal"]
          found = [x for x in fatal_markers if x.lower() in logs.lower()]
          with open("processes.txt","w") as out:
              out.write("Launch output:\n" + launch_text + "\n")
              out.write("Fatal markers: " + (", ".join(found) if found else "none") + "\n")

          if found:
              raise SystemExit("Fatal runtime markers found: " + ", ".join(found))
          PY

          sleep 5
          xcrun simctl io "$DEVICE" screenshot screenshot.png
          xcrun simctl spawn "$DEVICE" log show --style compact --last 4m \
            --predicate 'process CONTAINS[c] "AutoDiag" OR eventMessage CONTAINS[c] "AutoDiag"' > app-log.txt || true

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoDiagPro-iOS-v3.21.0-client-ui-smoke
          path: |
            screenshot.png
            launch.txt
            app-log.txt
            processes.txt
          if-no-files-found: error
          retention-days: 7
