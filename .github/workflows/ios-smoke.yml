name: iOS Runtime Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "AutoDiagPro.Mobile/**"
      - ".github/workflows/ios-smoke.yml"
      - "global.json"

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.425"

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Build iOS simulator app
        working-directory: AutoDiagPro.Mobile
        run: |
          dotnet build AutoDiagPro.Mobile.csproj \
            -f net8.0-ios \
            -c Release \
            -r iossimulator-arm64 \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false

      - name: Boot simulator and launch app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find AutoDiagPro.Mobile/bin/Release/net8.0-ios/iossimulator-arm64 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          DEVICE="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"
          xcrun simctl launch "$DEVICE" com.autodiagpro.app | tee launch.txt
          sleep 10
          xcrun simctl io "$DEVICE" screenshot screenshot.png
          xcrun simctl spawn "$DEVICE" log show --style compact --last 3m \
            --predicate 'process CONTAINS[c] "AutoDiag" OR eventMessage CONTAINS[c] "AutoDiag"' > app-log.txt || true

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: AutoDiagPro-iOS-v2.1.3-runtime-smoke
          path: |
            screenshot.png
            launch.txt
            app-log.txt
          if-no-files-found: error
          retention-days: 7
