name: iOS Runtime Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "AutoDiagPro.Mobile/**"
      - ".github/workflows/ios-smoke.yml"
      - "global.json"

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.425"

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Build iOS simulator app
        working-directory: AutoDiagPro.Mobile
        run: |
          dotnet build AutoDiagPro.Mobile.csproj \
            -f net8.0-ios \
            -c Debug \
            -r iossimulator-arm64 \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false \
            -p:DefineConstants=SMOKE_CLIENT_UI

      - name: Boot fresh simulator and launch app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find AutoDiagPro.Mobile/bin/Debug/net8.0-ios/iossimulator-arm64 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"

          # Fresh iOS runtimes validate bundle resources. Ad-hoc sign the simulator bundle
          # so SplashBoard/AppIcon resources are accepted during the runtime smoke test.
          /usr/bin/codesign --force --deep --sign - "$APP_PATH"

          DEVICE="$(python3 - <<'PY'
          import json, subprocess
          types=json.loads(subprocess.check_output(["xcrun","simctl","list","devicetypes","-j"]))["devicetypes"]
          runtimes=json.loads(subprocess.check_output(["xcrun","simctl","list","runtimes","-j"]))["runtimes"]
          dtype=next(x["identifier"] for x in types if x["name"]=="iPhone 16 Pro")
          runtime=[x["identifier"] for x in runtimes if x.get("isAvailable") and "iOS" in x.get("name","")][-1]
          print(subprocess.check_output(["xcrun","simctl","create","AutoDiagProSmoke",dtype,runtime], text=True).strip())
          PY
          )"

          test -n "$DEVICE"
          trap 'xcrun simctl shutdown "$DEVICE" >/dev/null 2>&1 || true; xcrun simctl delete "$DEVICE" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$DEVICE"

          python3 - "$DEVICE" "$APP_PATH" <<'PY'
          import subprocess, sys, time
          device, app_path = sys.argv[1], sys.argv[2]
          bundle = "com.autodiagpro.app"

          subprocess.run(["xcrun","simctl","bootstatus",device,"-b"], timeout=180, check=True)
          subprocess.run(["xcrun","simctl","install",device,app_path], timeout=180, check=True)

          launch = subprocess.run(
              ["xcrun","simctl","launch","--terminate-running-process",device,bundle],
              capture_output=True, text=True, timeout=45, check=True)
          launch_text = (launch.stdout or "") + (launch.stderr or "")
          with open("launch.txt","w") as out:
              out.write(launch_text)

          pid = None
          for token in launch_text.replace(":", " ").split():
              if token.isdigit():
                  pid = int(token)

          time.sleep(8)
          running = False
          process_text = ""
          if pid:
              probe = subprocess.run(
                  ["/bin/ps","-p",str(pid),"-o","pid=,comm=,args="],
                  capture_output=True, text=True, timeout=30)
              process_text = (probe.stdout or "") + "\\n--- STDERR ---\\n" + (probe.stderr or "")
              running = probe.returncode == 0 and str(pid) in probe.stdout

          with open("processes.txt","w") as out:
              out.write(process_text or f"No PID parsed from simctl launch output: {launch_text}\\n")

          if not running:
              subprocess.run(["xcrun","simctl","io",device,"screenshot","screenshot.png"], check=False)
              subprocess.run([
                  "xcrun","simctl","spawn",device,"log","show","--style","compact","--last","4m",
                  "--predicate",'process CONTAINS[c] "AutoDiag" OR eventMessage CONTAINS[c] "AutoDiag"'
              ], stdout=open("app-log.txt","w"), stderr=subprocess.STDOUT, text=True, check=False)
              print("\n=== LAUNCH ===")
              print(open("launch.txt", errors="ignore").read())
              print("\n=== APP LOG ===")
              print(open("app-log.txt", errors="ignore").read())
              print("\n=== PROCESSES ===")
              print(open("processes.txt", errors="ignore").read())
              raise SystemExit("AutoDiag Pro did not stay running after launch.")
          PY

          sleep 5
          xcrun simctl io "$DEVICE" screenshot screenshot.png
          xcrun simctl spawn "$DEVICE" log show --style compact --last 4m \
            --predicate 'process CONTAINS[c] "AutoDiag" OR eventMessage CONTAINS[c] "AutoDiag"' > app-log.txt || true

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoDiagPro-iOS-v3.1.0-client-ui-smoke
          path: |
            screenshot.png
            launch.txt
            app-log.txt
            processes.txt
          if-no-files-found: error
          retention-days: 7
