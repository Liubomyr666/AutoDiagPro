name: iOS Runtime Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "AutoDiagPro.Mobile/**"
      - ".github/workflows/ios-smoke.yml"
      - "global.json"

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.425"

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Build iOS simulator app
        working-directory: AutoDiagPro.Mobile
        run: |
          dotnet build AutoDiagPro.Mobile.csproj \
            -f net8.0-ios \
            -c Debug \
            -r iossimulator-arm64 \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false \
            -p:DefineConstants=SMOKE_CLIENT_UI

      - name: Boot simulator and launch app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find AutoDiagPro.Mobile/bin/Debug/net8.0-ios/iossimulator-arm64 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          DEVICE="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          python3 - "$DEVICE" "$APP_PATH" <<'PY'
          import subprocess, sys
          device, app_path = sys.argv[1], sys.argv[2]
          subprocess.run(["xcrun","simctl","bootstatus",device,"-b"], timeout=120, check=True)
          subprocess.run(["xcrun","simctl","install",device,app_path], timeout=60, check=True)
          launch = subprocess.run(["xcrun","simctl","launch",device,"com.autodiagpro.app"], timeout=30, check=True, text=True, capture_output=True)
          open("launch.txt","w").write(launch.stdout + launch.stderr)
          PY
          sleep 8
          xcrun simctl io "$DEVICE" screenshot screenshot.png
          xcrun simctl spawn "$DEVICE" log show --style compact --last 3m \
            --predicate 'process CONTAINS[c] "AutoDiag" OR eventMessage CONTAINS[c] "AutoDiag"' > app-log.txt || true

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: AutoDiagPro-iOS-v2.3.0-client-ui-smoke
          path: |
            screenshot.png
            launch.txt
            app-log.txt
          if-no-files-found: error
          retention-days: 7
